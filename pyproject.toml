[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ford-dcl"
version = "0.1.0"
description = "Host capture and read-only analysis for Ford EEC-IV DCL diagnostics"
requires-python = ">=3.10"
dependencies = ["pyserial"]

[project.optional-dependencies]
firmware = ["platformio"]

[project.scripts]
ford-dcl = "ford_dcl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
