[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0 -mtext-section-literals

; BLE feasibility build (NimBLE Nordic-UART service); not for vehicle use yet.
[env:esp32dev_ble]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DSME105_BLE
lib_deps = h2zero/NimBLE-Arduino@^1.4.3
